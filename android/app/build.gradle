apply plugin: 'com.android.application'

def releaseStore = System.getenv('BILI_KEYSTORE')

android {
    namespace 'com.dom.bilidownloader'
    compileSdk 34

    defaultConfig {
        applicationId "com.dom.bilidownloader"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "1.3.0"
    }

    signingConfigs {
        if (releaseStore) {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('BILI_STORE_PASSWORD')
                keyAlias System.getenv('BILI_KEY_ALIAS')
                keyPassword System.getenv('BILI_KEY_PASSWORD')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseStore) signingConfig signingConfigs.release
        }
    }
}
