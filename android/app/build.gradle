apply plugin: 'com.android.application'

def releaseStore = System.getenv('BILI_KEYSTORE')

android {
    namespace 'com.dom.bilidownloader'
    compileSdk 34

    defaultConfig {
        applicationId "com.dom.bilidownloader"
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName "1.3.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (releaseStore) {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('BILI_STORE_PASSWORD')
                keyAlias System.getenv('BILI_KEY_ALIAS')
                keyPassword System.getenv('BILI_KEY_PASSWORD')
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseStore) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
